<style>
  :root {
    --bg: #121216;
    --cream: #fdf6e3;
    --ink: #15151a;
    --red: #e8232a;
    --blue: #1c3f94;
    --gold: #e8a400;
    --muted: #6b6b73;
    --white: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: 64px; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Poppins', sans-serif;
    font-weight: 500;
    background-image: radial-gradient(circle, rgba(255,255,255,0.05) 1.2px, transparent 1.2px);
    background-size: 16px 16px;
  }

  /* ---------- Sticky nav ---------- */
  .navbar {
    position: sticky;
    top: 0; left: 0; right: 0;
    z-index: 50;
    background: var(--ink);
    padding: calc(10px + env(safe-area-inset-top, 0px)) 12px 10px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    overflow-x: auto;
    border-bottom: 3px solid var(--gold);
    scrollbar-width: none;
  }
  .navbar::-webkit-scrollbar { display: none; }
  .navbar .brand {
    font-family: 'Bangers', cursive;
    color: var(--gold);
    font-size: 15px;
    letter-spacing: 1px;
    flex-shrink: 0;
    padding-right: 6px;
    border-right: 2px solid #333;
    margin-right: 2px;
  }
  .daychip {
    flex-shrink: 0;
    font-family: 'Bangers', cursive;
    font-size: 14px;
    letter-spacing: 1px;
    color: var(--white);
    background: #26262e;
    border: 2px solid transparent;
    border-radius: 999px;
    padding: 6px 14px;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
  }
  .daychip:active { transform: scale(0.95); }

  /* ---------- Hero ---------- */
  .hero {
    position: relative;
    padding: 34px 20px 30px 20px;
    text-align: center;
    overflow: hidden;
  }
  .hero-star {
    width: 230px; height: 230px;
    margin: 0 auto;
    position: relative;
  }
  .hero-star svg { width: 100%; height: 100%; }
  .hero-star-text {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }
  .hero-kicker {
    font-family: 'Bangers', cursive;
    color: var(--gold);
    font-size: 15px;
    letter-spacing: 3px;
    margin-bottom: 14px;
  }
  .hero-title {
    font-family: 'Bangers', cursive;
    font-size: 40px;
    line-height: 0.95;
    color: var(--red);
    text-shadow: 3px 3px 0 var(--blue);
  }
  .hero-sub {
    font-family: 'Bangers', cursive;
    font-size: 20px;
    color: var(--gold);
    letter-spacing: 1px;
    margin-top: 16px;
  }
  .hero-dates {
    font-size: 12px;
    color: #cfd2dc;
    letter-spacing: 2px;
    margin-top: 8px;
    font-weight: 800;
  }
  .hero-progress {
    margin: 20px auto 0 auto;
    max-width: 280px;
    font-size: 11px;
    color: #9a9aa3;
    letter-spacing: 1px;
    font-weight: 700;
  }
  .hero-progress-bar {
    height: 8px;
    background: #26262e;
    border-radius: 999px;
    margin-top: 6px;
    overflow: hidden;
    border: 2px solid #333;
  }
  .hero-progress-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, var(--red), var(--gold));
    transition: width .3s ease;
  }

  /* ---------- Day sections ---------- */
  .day-section {
    scroll-margin-top: 58px;
    padding: 10px 16px 6px 16px;
    border-bottom: 2px solid #26262e;
  }
  .day-section:last-child { border-bottom: none; }
  .day-badge-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin: 16px 0;
    cursor: pointer;
    padding: 4px;
    border-radius: 14px;
  }
  .day-badge-row:active { background: #1c1c22; }
  .day-chevron {
    margin-left: auto;
    flex-shrink: 0;
    width: 22px; height: 22px;
    color: #9a9aa3;
    transition: transform .2s ease;
  }
  .day-section.open .day-chevron { transform: rotate(180deg); color: var(--accent); }
  .day-body {
    display: none;
    animation: dropIn .18s ease;
  }
  .day-section.open .day-body { display: block; }
  @keyframes dropIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .day-star {
    width: 62px; height: 62px;
    flex-shrink: 0;
    position: relative;
  }
  .day-star svg { width: 100%; height: 100%; }
  .day-star-num {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bangers', cursive;
    color: #fff;
    font-size: 13px;
    line-height: 1.05;
    text-align: center;
  }
  .day-heading-text { text-align: left; }
  .day-heading-label {
    font-family: 'Bangers', cursive;
    font-size: 24px;
    color: var(--white);
    letter-spacing: 1px;
  }
  .day-heading-date {
    font-size: 11px;
    color: #9a9aa3;
    letter-spacing: 2px;
    font-weight: 700;
    margin-top: 2px;

  .panel {
    background: var(--cream);
    border: 4px solid var(--ink);
    border-radius: 14px;

  .item {
    display: flex;

  .item:last-child { border-bottom: none; }
  .item-check {
    flex-shrink: 0;

  }
  .item-check svg { width: 13px; height: 13px; opacity: 0; transition: opacity .15s ease; }

  .item-text { flex: 1; min-width: 0; }
  .item-name {
    font-weight: 800;

  .item.visited .item-name {

  .item-sub {

  }
  .item.visited .item-sub { opacity: 0.45; }
  .item-map {
    flex-shrink: 0;
    margin-top: 2px;
    font-size: 11px;
    font-weight: 700;
    color: var(--accent, var(--red));
    text-decoration: none;
    white-space: nowrap;
    padding: 4px 0 4px 6px;
  }

  .stripe {
    margin: 0 0 6px 0;
    padding: 14px 16px;
    border-radius: 12px;
    background: var(--accent, var(--red));
    background-image: repeating-linear-gradient(135deg, rgba(255,255,255,0.12) 0 16px, transparent 16px 32px);
    text-align: center;
  }
  .stripe span {
    font-family: 'Bangers', cursive;
    color: #fff;
    font-size: 14px;
    letter-spacing: 1px;
  }

  footer {
    text-align: center;
    padding: 28px 20px calc(30px + env(safe-area-inset-bottom, 0px)) 20px;
  }
  footer .credit {
    font-family: 'Bangers', cursive;
    color: var(--gold);
    font-size: 15px;
    letter-spacing: 1px;
  }
  footer .credit2 {
    font-size: 10px;
    color: #6b6b73;
    margin-top: 6px;
    letter-spacing: 1px;
  }

  @media (min-width: 640px) {
    .day-section, .hero { max-width: 560px; margin: 0 auto; }
    .navbar > * { margin: 0 auto; }
  }

  /* ---------- Edit controls ---------- */
  .item-actions {
    display: flex;
    gap: 2px;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .icon-btn {
    background: none;
    border: none;
    font-size: 14px;
    padding: 4px 6px;

    color: var(--muted);
    opacity: 0.7;

  .icon-btn:active { opacity: 1; }

  .edit-form {
    padding: 12px 0;

  .edit-form input::placeholder { color: #aaa; font-weight: 500; }
  .edit-form-row { display: flex; gap: 8px; }

  .btn-save { background: var(--accent, var(--red)); color: #fff; }

  .add-place-btn {

  }
  .add-place-btn:active { opacity: 0.7; }

  .day-head-actions {
    margin-left: auto;
    display: flex;
    gap: 2px;
  }
  .day-badge-row { position: relative; }

  .add-day-section {
    padding: 10px 16px 6px 16px;
    text-align: center;
  }
  .add-day-btn {
    display: inline-block;
    padding: 12px 26px;
    background: none;
    border: 3px dashed var(--gold);
    border-radius: 12px;
    color: var(--gold);
    font-family: 'Bangers', cursive;
    font-size: 16px;
    letter-spacing: 1px;
    cursor: pointer;
  }
  .add-day-form {
    max-width: 320px;
    margin: 14px auto 0 auto;
    text-align: left;
    background: var(--cream);
    border: 4px solid var(--ink);
    border-radius: 14px;
    padding: 16px;
    box-shadow: 6px 6px 0 var(--gold);
  }
  .add-day-form input {
    width: 100%;
    font-family: 'Poppins', sans-serif;
    font-size: 14px;
    font-weight: 700;
    padding: 9px 10px;
    border: 2px solid var(--ink);
    border-radius: 8px;

  }
  .add-day-form input::placeholder { color: #aaa; font-weight: 500; }
  .add-day-colors { display: flex; gap: 8px; margin-bottom: 10px; }
  .color-swatch {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 3px solid transparent;
    cursor: pointer;
  }
  .color-swatch.selected { border-color: #fff; }
</style>

<body>

<nav class="navbar" id="navbar">
  <span class="brand">NYC</span>
  <div id="nav-chips" style="display:flex; gap:8px;"></div>
</nav>

<div class="hero">

  <div class="hero-star">

    </div>

</div>

<footer>

  <div class="credit2">Toca un lugar para marcarlo como visitado · ✎ para editar</div>
</footer>

<script>
  var DEFAULT_DAYS = [
    { id: "day1", num: 1, date: "MIÉRCOLES 7 OCT", color: "#e8232a", places: [
      { id: "d1p0", name: "Llegada al hotel", sub: "Check-in · vuelo llega 9:40 AM", map: null },
      { id: "d1p1", name: "Quinta Avenida", sub: "5th Ave, Manhattan", map: "5th Ave, Manhattan" },

      { id: "d1p3", name: "Bryant Park", sub: "Bryant Park, Manhattan", map: "Bryant Park Manhattan" },
      { id: "d1p4", name: "Summit (One Vanderbilt)", sub: "1 Vanderbilt Ave, Manhattan", map: "1 Vanderbilt Ave Manhattan" }
    ]},
    { id: "day2", num: 2, date: "JUEVES 8 OCT", color: "#1c3f94", places: [
      { id: "d2p0", name: "Estatua de la Libertad", sub: "Liberty Island (ferry desde Battery Park)", map: "Statue of Liberty" },
      { id: "d2p1", name: "Wall Street", sub: "Financial District, Manhattan", map: "Wall Street Manhattan" },
      { id: "d2p2", name: "Memorial 9/11", sub: "180 Greenwich St, Manhattan", map: "9/11 Memorial" },
      { id: "d2p3", name: "Oculus", sub: "185 Greenwich St, Manhattan", map: "Oculus Manhattan" },
      { id: "d2p4", name: "Empire State Building", sub: "350 Fifth Ave, Manhattan", map: "Empire State Building" },
      { id: "d2p5", name: "Chinatown", sub: "Canal St, Manhattan", map: "Chinatown Manhattan" },
      { id: "d2p6", name: "Little Italy", sub: "Mulberry St, Manhattan", map: "Little Italy Manhattan" }
    ]},
    { id: "day3", num: 3, date: "VIERNES 9 OCT", color: "#e8a400", places: [
      { id: "d3p0", name: "New York Comic Con", sub: "429 11th Ave (Javits Center) · el día grande", map: "Javits Center" },
      { id: "d3p1", name: "Forbidden Planet", sub: "832 Broadway, Manhattan", map: "Forbidden Planet NYC" },
      { id: "d3p2", name: "Vessel", sub: "20 Hudson Yards, Manhattan", map: "Vessel Hudson Yards" },
      { id: "d3p3", name: "The High Line", sub: "Gansevoort St a W 34th St, Manhattan", map: "The High Line NYC" },
      { id: "d3p4", name: "Chelsea Market", sub: "75 9th Ave, Manhattan", map: "Chelsea Market" }
    ]},
    { id: "day4", num: 4, date: "SÁBADO 10 OCT", color: "#1c3f94", places: [
      { id: "d4p0", name: "Brooklyn Bridge", sub: "Brooklyn Bridge, Manhattan", map: "Brooklyn Bridge" },
      { id: "d4p1", name: "DUMBO", sub: "DUMBO, Brooklyn", map: "Dumbo Brooklyn" },
      { id: "d4p2", name: "Time Out Market DUMBO — Bark Barbecue", sub: "55 Water St, Brooklyn · asado tejano-dominicano", map: "Time Out Market Dumbo" },
      { id: "d4p3", name: "SoHo", sub: "Broadway y Prince St, Manhattan", map: "SoHo Manhattan" },
      { id: "d4p4", name: "East Village", sub: "East Village, Manhattan", map: "East Village Manhattan" },
      { id: "d4p5", name: "Circle Line Cruise", sub: "Pier 83, Manhattan", map: "Circle Line Cruise Pier 83" }
    ]},
    { id: "day5", num: 5, date: "DOMINGO 11 OCT", color: "#e8232a", places: [
      { id: "d5p0", name: "Central Park", sub: "5th Ave y 59th St, Manhattan", map: "Central Park" },
      { id: "d5p1", name: "The Met", sub: "1000 5th Ave, Manhattan", map: "The Met Museum" },
      { id: "d5p2", name: "Intrepid Museum", sub: "Pier 86 · acá se dividen, va Diego o Esteban", map: "Intrepid Museum" },
      { id: "d5p3", name: "MoMA", sub: "11 W 53rd St · acá se dividen, va Diego o Esteban", map: "MoMA New York" }
    ]},
    { id: "day6", num: 6, date: "LUNES 12 OCT", color: "#e8a400", places: [
      { id: "d6p0", name: "Desfile Columbus Day", sub: "5th Ave, Manhattan · 11:30am a 3:30pm", map: "5th Ave Manhattan" },
      { id: "d6p1", name: "Vuelo de regreso a Chile", sub: "Sale 19:50 · hay tiempo de sobra para el desfile", map: null }
    ]}
  ];

  var STORE_KEY = 'esteban_itinerario_v2';
  var VISITED_KEY = 'esteban_itinerario_visited_v1';
  var state = { days: null };
  var visited = {};
  var pendingColor = '#e8232a';
  var openDayId = null;
  var dayDeleteConfirm = null;

  function deepCopy(x){ return JSON.parse(JSON.stringify(x)); }

  function loadState(){
    try {
      var raw = localStorage.getItem(STORE_KEY);
      state.days = raw ? JSON.parse(raw) : deepCopy(DEFAULT_DAYS);
    } catch(e) { state.days = deepCopy(DEFAULT_DAYS); }
    try {
      var rawV = localStorage.getItem(VISITED_KEY);
      if (rawV) visited = JSON.parse(rawV);
    } catch(e) {}
  }
  function saveState(){
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state.days)); } catch(e) {}
  }
  function saveVisited(){
    try { localStorage.setItem(VISITED_KEY, JSON.stringify(visited)); } catch(e) {}
  }

  function starSVG(color){
    return '<svg viewBox="0 0 100 100"><polygon points="50,2 61,35 98,35 68,57 79,91 50,70 21,91 32,57 2,35 39,35" fill="' + color + '" stroke="#15151a" stroke-width="4"/></svg>';
  }
  function checkSVG(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  }
  function esc(s){
    var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML;
  }

  function findDay(dayId){ return state.days.filter(function(d){ return d.id === dayId; })[0]; }

  function renderAll(){
    renderNav();
    renderDays();
    updateProgress();
  }

  function renderNav(){
    var nav = document.getElementById('nav-chips');
    var html = '';
    state.days.forEach(function(d){
      html += '<button type="button" class="daychip" data-day="' + d.id + '" onclick="openDay(\'' + d.id + '\')">DÍA ' + d.num + '</button>';
    });
    nav.innerHTML = html;
  }

  function renderDays(){
    var container = document.getElementById('days-container');
    var html = '';
    state.days.forEach(function(day){
      var isOpen = day.id === openDayId;
      html += '<section class="day-section' + (isOpen ? ' open' : '') + '" id="' + day.id + '" style="--accent:' + day.color + ';">';
      html += '<div class="day-badge-row" onclick="toggleDayOpen(\'' + day.id + '\')">';
      html += '<div class="day-star">' + starSVG(day.color) + '<div class="day-star-num">DÍA<br>' + day.num + '</div></div>';
      html += '<div class="day-heading-text" id="heading-' + day.id + '">' + dayHeadingHTML(day) + '</div>';
      html += '<div class="day-head-actions" onclick="event.stopPropagation()">';
      html += '<button class="icon-btn" onclick="startEditDayLabel(\'' + day.id + '\')" title="Editar fecha">✎</button>';
      html += '<button class="icon-btn" id="del-' + day.id + '" onclick="handleDeleteDay(\'' + day.id + '\')" title="Eliminar día">🗑</button>';
      html += '</div>';
      html += '<svg class="day-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
      html += '</div>';
      html += '<div class="day-body" id="body-' + day.id + '">';
      html += '<div class="panel">';
      day.places.forEach(function(p){
        html += placeItemHTML(day.id, p);
      });
      html += '<button class="add-place-btn" onclick="startAddPlace(\'' + day.id + '\')">+ Agregar lugar</button>';
      html += '</div>';
      html += '<div class="stripe"><span>★ CREADO POR MELITALOVE® ★</span></div>';
      html += '</div>';
      html += '</section>';
    });
    container.innerHTML = html;
    highlightNav();
  }

  window.toggleDayOpen = function(dayId){
    openDayId = (openDayId === dayId) ? null : dayId;
    renderDays();
  };
  window.openDay = function(dayId){
    openDayId = dayId;
    renderDays();
    scrollToDay(dayId);
  };
  function scrollToDay(dayId){
    requestAnimationFrame(function(){
      var el = document.getElementById(dayId);
      if (!el) return;
      try {
        var top = el.getBoundingClientRect().top + window.pageYOffset - 54;
        window.scrollTo({ top: top, behavior: 'smooth' });
      } catch(e) {}
      try { el.scrollIntoView({ behavior: 'smooth', block: 'start' }); } catch(e) {}
      // Native fallback: always works, even where scripted smooth-scroll is restricted
      if (window.location.hash !== '#' + dayId) {
        window.location.hash = dayId;
      } else {
        window.location.hash = '';
        window.location.hash = dayId;
      }
    });
  }

  function dayHeadingHTML(day){
    return '<div class="day-heading-label">Día ' + day.num + '</div><div class="day-heading-date">' + esc(day.date) + '</div>';
  }

  function placeItemHTML(dayId, p){
    var isVisited = visited[p.id] ? ' visited' : '';
    var html = '<div class="item' + isVisited + '" data-id="' + p.id + '" id="item-' + p.id + '">';
    html += '<div class="item-check" onclick="toggleVisited(\'' + p.id + '\')">' + checkSVG() + '</div>';
    html += '<div class="item-text" onclick="toggleVisited(\'' + p.id + '\')"><div class="item-name">' + esc(p.name) + '</div><div class="item-sub">' + esc(p.sub) + '</div></div>';
    html += '<div class="item-actions">';
    if (p.map) {
      html += '<a class="item-map" href="https://maps.google.com/?q=' + encodeURIComponent(p.map) + '" target="_blank" rel="noopener">📍</a>';
    }
    html += '<button class="icon-btn" onclick="startEditPlace(\'' + dayId + '\',\'' + p.id + '\')">✎</button>';
    html += '<button class="icon-btn" onclick="deletePlace(\'' + dayId + '\',\'' + p.id + '\')">🗑</button>';
    html += '</div></div>';
    return html;
  }

  /* ---------- visited ---------- */
  window.toggleVisited = function(placeId){
    visited[placeId] = !visited[placeId];
    var el = document.getElementById('item-' + placeId);
    if (el) el.classList.toggle('visited');
    saveVisited();
    updateProgress();
  };

  function updateProgress(){
    var total = 0, count = 0;
    state.days.forEach(function(d){
      d.places.forEach(function(p){
        total++;
        if (visited[p.id]) count++;
      });
    });
    var pct = total > 0 ? Math.round((count / total) * 100) : 0;
    document.getElementById('progress-label').textContent = count + ' de ' + total + ' lugares visitados';
    document.getElementById('progress-fill').style.width = pct + '%';
  }

  /* ---------- edit / add / delete place ---------- */
  window.startEditPlace = function(dayId, placeId){
    var day = findDay(dayId);
    var place = day.places.filter(function(p){ return p.id === placeId; })[0];
    var el = document.getElementById('item-' + placeId);
    el.outerHTML =
      '<div class="edit-form" id="item-' + placeId + '">' +
        '<input id="edit-name-' + placeId + '" type="text" value="' + esc(place.name) + '" placeholder="Nombre del lugar">' +
        '<input id="edit-sub-' + placeId + '" type="text" value="' + esc(place.sub) + '" placeholder="Dirección o nota">' +
        '<div class="edit-form-row">' +
          '<button class="btn-save" onclick="commitEditPlace(\'' + dayId + '\',\'' + placeId + '\')">Guardar</button>' +
          '<button class="btn-cancel" onclick="renderDays()">Cancelar</button>' +
        '</div>' +
      '</div>';
  };
  window.commitEditPlace = function(dayId, placeId){
    var day = findDay(dayId);
    var place = day.places.filter(function(p){ return p.id === placeId; })[0];
    var newName = document.getElementById('edit-name-' + placeId).value.trim();
    var newSub = document.getElementById('edit-sub-' + placeId).value.trim();
    if (newName) place.name = newName;
    place.sub = newSub;
    place.map = newName ? (newName + (newSub ? ', ' + newSub : '')) : place.map;
    saveState();
    renderDays();
  };
  window.deletePlace = function(dayId, placeId){
    var day = findDay(dayId);
    day.places = day.places.filter(function(p){ return p.id !== placeId; });
    saveState();
    renderDays();
    updateProgress();
  };
  window.startAddPlace = function(dayId){
    var day = findDay(dayId);
    var tempId = 'new-' + dayId;
    var btn = document.querySelector('#' + dayId + ' .add-place-btn');
    btn.outerHTML =
      '<div class="edit-form" id="' + tempId + '">' +
        '<input id="addname-' + dayId + '" type="text" placeholder="Nombre del lugar">' +
        '<input id="addsub-' + dayId + '" type="text" placeholder="Dirección o nota">' +
        '<div class="edit-form-row">' +
          '<button class="btn-save" onclick="confirmAddPlace(\'' + dayId + '\')">Agregar</button>' +
          '<button class="btn-cancel" onclick="renderDays()">Cancelar</button>' +
        '</div>' +
      '</div>';
    document.getElementById('addname-' + dayId).focus();
  };
  window.confirmAddPlace = function(dayId){
    var name = document.getElementById('addname-' + dayId).value.trim();
    var sub = document.getElementById('addsub-' + dayId).value.trim();
    if (!name) { renderDays(); return; }
    var day = findDay(dayId);
    var newId = dayId + '-p' + Date.now() + Math.floor(Math.random() * 1000);
    day.places.push({ id: newId, name: name, sub: sub, map: name + (sub ? ', ' + sub : '') });
    saveState();
    renderDays();
    updateProgress();
  };

  /* ---------- edit day label ---------- */
  window.startEditDayLabel = function(dayId){
    var day = findDay(dayId);
    var el = document.getElementById('heading-' + dayId);
    el.innerHTML =
      '<div class="add-day-form" style="margin:0; max-width:220px; box-shadow:5px 5px 0 ' + day.color + ';">' +
        '<input id="editday-' + dayId + '" type="text" value="' + esc(day.date) + '" placeholder="Ej: MARTES 13 OCT">' +
        '<div class="edit-form-row">' +
          '<button class="btn-save" style="background:' + day.color + ';" onclick="commitEditDayLabel(\'' + dayId + '\')">Guardar</button>' +
          '<button class="btn-cancel" onclick="renderDays()">Cancelar</button>' +
        '</div>' +
      '</div>';
    document.getElementById('editday-' + dayId).focus();
  };
  window.commitEditDayLabel = function(dayId){
    var day = findDay(dayId);
    var val = document.getElementById('editday-' + dayId).value.trim();
    if (val) day.date = val.toUpperCase();
    saveState();
    renderDays();
  };

  /* ---------- delete day (double-tap confirm) ---------- */
  window.handleDeleteDay = function(dayId){
    var btn = document.getElementById('del-' + dayId);
    if (dayDeleteConfirm !== dayId) {
      dayDeleteConfirm = dayId;
      btn.textContent = '⚠️';
      btn.style.color = '#ff6b6b';
      setTimeout(function(){
        if (dayDeleteConfirm === dayId) {
          dayDeleteConfirm = null;
          if (btn) { btn.textContent = '🗑'; btn.style.color = ''; }
        }
      }, 3500);
    } else {
      dayDeleteConfirm = null;
      state.days = state.days.filter(function(d){ return d.id !== dayId; });
      if (openDayId === dayId) openDayId = state.days.length ? state.days[0].id : null;
      saveState();
      renderAll();
    }
  };

  /* ---------- add day ---------- */
  window.toggleAddDayForm = function(){
    var form = document.getElementById('add-day-form');
    var btn = document.getElementById('add-day-toggle');
    var showing = form.style.display === 'block';
    form.style.display = showing ? 'none' : 'block';
    btn.style.display = showing ? 'inline-block' : 'none';
    if (!showing) document.getElementById('new-day-label').focus();
  };
  window.selectDayColor = function(el){
    document.querySelectorAll('.color-swatch').forEach(function(s){ s.classList.remove('selected'); });
    el.classList.add('selected');
    pendingColor = el.getAttribute('data-color');
  };
  window.confirmAddDay = function(){
    var label = document.getElementById('new-day-label').value.trim();
    if (!label) return;
    var nextNum = state.days.length ? Math.max.apply(null, state.days.map(function(d){ return d.num; })) + 1 : 1;
    var newId = 'day' + Date.now();
    state.days.push({ id: newId, num: nextNum, date: label.toUpperCase(), color: pendingColor, places: [] });
    openDayId = newId;
    saveState();
    document.getElementById('new-day-label').value = '';
    toggleAddDayForm();
    renderAll();
    scrollToDay(newId);
  };

  /* ---------- nav highlight: reflects which day is open ---------- */
  function highlightNav(){
    var chips = document.querySelectorAll('.daychip');
    chips.forEach(function(c){
      if (c.getAttribute('data-day') === openDayId) {
        c.style.background = '#e8a400';
        c.style.color = '#15151a';
      } else {
        c.style.background = '#26262e';
        c.style.color = '#fff';
      }
    });
  }

  /* ---------- init ---------- */
  loadState();
  openDayId = state.days.length ? state.days[0].id : null;
  renderAll();
</script>

</body>
</html>
